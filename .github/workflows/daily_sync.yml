name: Weekly Data Sync

on:
  schedule:
    # Runs every Friday at 18:00 IST (12:30 UTC) after Indian market closes for the week
    - cron: '30 12 * * 5'
  workflow_dispatch: # Allows triggering manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline (Fetch 5Y Nifty 50 Data)
        run: |
          python src/pipeline.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.db
          if git diff --staged --quiet; then
            echo "Database already up to date. No changes to commit."
          else
            git commit -m "fetched(data): weekly update screener database [skip ci]"
            git push
          fi
