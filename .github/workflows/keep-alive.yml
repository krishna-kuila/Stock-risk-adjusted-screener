name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install playwright

      - name: Get Playwright Version
        id: pw-version
        run: echo "VERSION=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (if not cached)
        run: playwright install chromium

      - name: Wake up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          APP_URL = 'https://stock-risk-adjusted-screener.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f'Navigating to {APP_URL}...')
              try:
                  page.goto(APP_URL, timeout=45000)
                  
                  # Look for Streamlit's wake-up button with a short timeout
                  wake_button = page.locator('button:has-text(\"Yes, get this app back up\")')
                  wake_button.wait_for(state='visible', timeout=5000)
                  
                  print('App is sleeping. Clicking wake-up button...')
                  wake_button.click()
                  page.wait_for_timeout(5000)
                  print('Wake-up signal sent successfully.')
              except Exception as e:
                  print(f'Note: Wake-up button not found or already active. Details: {e}')
              finally:
                  browser.close()
          "
