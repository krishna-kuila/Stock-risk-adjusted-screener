name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Playwright Python package
        run: pip install playwright

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install Playwright browser (if not cached)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Wake up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          APP_URL = 'https://stock-risk-adjusted-screener.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f'Navigating to {APP_URL}...')
              page.goto(APP_URL, timeout=60000)

              wake_button = page.locator('button:has-text(\"Yes, get this app back up\")')
              
              try:
                  wake_button.wait_for(state='visible', timeout=7000)
                  print('App is sleeping. Clicking wake-up button...')
                  wake_button.click()
                  page.wait_for_timeout(10000)
                  print('Wake-up signal sent successfully.')
              except Exception:
                  print('Wake-up button not found. App is already active.')
              finally:
                  browser.close()
          "